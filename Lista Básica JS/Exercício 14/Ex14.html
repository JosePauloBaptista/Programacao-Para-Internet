<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="ex14.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="calculadora">
        <div id="display"></div>
        <div id="teclado">
            <button class="button buttonOp" id="bntMais">+</button>
            <button class="button buttonOp" id="bntMenos">-</button>
            <button class="button buttonOp" id="bntMult">*</button>
            <button class="button buttonOp" id="bntDiv">/</button>
            <button class="button buttonChar buttonNumber" id="bnt1">1</button>
            <button class="button buttonChar buttonNumber" id="bnt2">2</button>
            <button class="button buttonChar buttonNumber" id="bnt3">3</button>
            <button class="button buttonChar buttonNumber" id="bnt4">4</button>
            <button class="button buttonChar buttonNumber" id="bnt5">5</button>
            <button class="button buttonChar buttonNumber" id="bnt6">6</button>
            <button class="button buttonChar buttonNumber" id="bnt7">7</button>
            <button class="button buttonChar buttonNumber" id="bnt8">8</button>
            <button class="button buttonChar buttonNumber" id="bnt9">9</button>
            <button class="button buttonChar buttonNumber" id="bnt0">0</button>
            <button class="button buttonChar " id="bntdot">.</button>
            <button class="button buttonChar " id="bntClear">C</button>
            <button class="button equal" id="bntequal">=</button>
        </div>
    </div>
</body>
<script src="./JS14.js"></script>
</html>
